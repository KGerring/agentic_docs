<title>__TITLE__</title>
__FONT_LINK__
<style>
/* Layout: sticky bar (name, search, view switch) · filter rail left · results right.
   A node opens as its own page: body on the left, properties and typed relations on the right. */
:root {
  --bg: #f3f5f2;
  --surface: #fcfcfb;
  --sunken: #e9ece8;
  --ink: #15191a;
  --ink-2: #4c5553;
  --ink-3: #737c79;
  --line: #d9ddd8;
  --line-strong: #b4bbb6;
  --accent: #0e5f5a;
  --accent-ink: #ffffff;
  --accent-wash: #dcebe8;
  --warn: #9a5b00;
  /* node types: one fixed categorical slot each (validated order, never cycled) */
  --t-tool: #2a78d6;
  --t-script: #eb6834;
  --t-fn: #1baf7a;
  --t-session: #eda100;
  --t-day: #e87ba4;
  --t-repo: #008300;
  --t-log: #4a3aa7;
  --t-logday: #e34948;
  --t-other: #737c79;
  --font-display: __FONT_DISPLAY__;
  --font-body: __FONT_BODY__;
  --font-mono: __FONT_MONO__;
  --radius: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121413; --surface: #1a1a19; --sunken: #222524; --ink: #eef1ee; --ink-2: #b9c0bc;
    --ink-3: #8b938f; --line: #2d312f; --line-strong: #4a504d; --accent: #74cfc5; --accent-ink: #0b1f1d;
    --accent-wash: #1c302e; --warn: #e3a94a;
    --t-tool: #3987e5; --t-script: #d95926; --t-fn: #199e70; --t-session: #c98500; --t-day: #d55181;
    --t-repo: #008300; --t-log: #9085e9; --t-logday: #e66767; --t-other: #8b938f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121413; --surface: #1a1a19; --sunken: #222524; --ink: #eef1ee; --ink-2: #b9c0bc;
  --ink-3: #8b938f; --line: #2d312f; --line-strong: #4a504d; --accent: #74cfc5; --accent-ink: #0b1f1d;
  --accent-wash: #1c302e; --warn: #e3a94a;
  --t-tool: #3987e5; --t-script: #d95926; --t-fn: #199e70; --t-session: #c98500; --t-day: #d55181;
  --t-repo: #008300; --t-log: #9085e9; --t-logday: #e66767; --t-other: #8b938f;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--font-body); }
a { color: var(--accent); text-underline-offset: 2px; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.mono { font-family: var(--font-mono); font-size: 0.86em; }

/* ---- bar ---- */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.bar-in {
  max-width: 1320px; margin-inline: auto; padding: 10px 20px;
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px;
}
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; text-decoration: none; color: var(--ink); }
.brand b { font: 600 19px/1.2 var(--font-display); letter-spacing: -0.01em; white-space: nowrap; }
.brand span { color: var(--ink-3); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.search { flex: 1 1 240px; min-width: 0; position: relative; }
.search input {
  width: 100%; padding: 7px 10px 7px 30px; border: 1px solid var(--line-strong); border-radius: var(--radius);
  background: var(--bg);
}
.search::before {
  content: ""; position: absolute; left: 11px; top: 50%; width: 9px; height: 9px; margin-top: -7px;
  border: 1.6px solid var(--ink-3); border-radius: 50%; box-shadow: 5px 5px 0 -3.6px var(--ink-3);
}
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--radius); overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 6px 13px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line-strong); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }

.notice { max-width: 1320px; margin: 0 auto; padding: 10px 20px 0; color: var(--ink-2); font-size: 13px; }
.notice:empty { display: none; }

/* ---- shell ---- */
.shell {
  max-width: 1320px; margin-inline: auto; padding-inline: 20px; padding-block: 18px 56px;
  display: grid; grid-template-columns: 236px minmax(0, 1fr); gap: 26px; align-items: start;
}
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 68px); max-height: calc(100vh - 88px); overflow-y: auto; padding-right: 4px; }
.rail h2, .aside h2 {
  font: 600 11px/1 var(--font-body); letter-spacing: 0.09em; text-transform: uppercase; color: var(--ink-3);
  margin: 0 0 8px;
}
.rail section + section { margin-top: 20px; }
.rail-toggle { display: none; }
.opt { display: flex; align-items: center; gap: 8px; width: 100%; padding: 4px 6px; border: 0; border-radius: 4px;
  background: transparent; text-align: left; cursor: pointer; }
.opt:hover { background: var(--sunken); }
.opt[aria-pressed="true"] { background: var(--accent-wash); }
.opt .n { margin-left: auto; color: var(--ink-3); font-variant-numeric: tabular-nums; font-size: 12.5px; }
.opt .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.opt[data-zero="1"] { opacity: 0.45; }
.tagbox { display: flex; flex-wrap: wrap; gap: 5px; }
.tag {
  border: 1px solid var(--line-strong); background: transparent; border-radius: 99px; padding: 1px 9px;
  font-size: 12.5px; cursor: pointer; white-space: nowrap; color: var(--ink-2);
}
.tag:hover { border-color: var(--ink-2); }
.tag[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.tag small { color: inherit; opacity: 0.65; margin-left: 3px; font-variant-numeric: tabular-nums; }
.linkish { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; font-size: 13px; }
.rail input[type="search"] { width: 100%; padding: 4px 8px; margin-bottom: 8px; border: 1px solid var(--line-strong); border-radius: 4px; background: var(--bg); font-size: 13px; }

/* ---- type glyphs (shape + colour: identity never rests on colour alone) ---- */
.glyph { width: 11px; height: 11px; flex: none; display: inline-block; background: var(--c, var(--t-other)); }
.glyph[data-t="tool"] { border-radius: 50%; }
.glyph[data-t="script"] { border-radius: 1px; }
.glyph[data-t="fn"] { transform: rotate(45deg) scale(0.82); }
.glyph[data-t="session"] { clip-path: polygon(50% 0, 100% 100%, 0 100%); }
.glyph[data-t="day"] { clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%); }
.glyph[data-t="repo"] { clip-path: polygon(50% 0, 100% 38%, 81% 100%, 19% 100%, 0 38%); }
.glyph[data-t="log"] { clip-path: polygon(0 0, 100% 0, 50% 100%); }
.glyph[data-t="logday"] { clip-path: polygon(35% 0, 65% 0, 65% 35%, 100% 35%, 100% 65%, 65% 65%, 65% 100%, 35% 100%, 35% 65%, 0 65%, 0 35%, 35% 35%); }
[data-t="tool"] { --c: var(--t-tool); } [data-t="script"] { --c: var(--t-script); }
[data-t="fn"] { --c: var(--t-fn); } [data-t="session"] { --c: var(--t-session); }
[data-t="day"] { --c: var(--t-day); } [data-t="repo"] { --c: var(--t-repo); }
[data-t="log"] { --c: var(--t-log); } [data-t="logday"] { --c: var(--t-logday); }

/* ---- results ---- */
.status-line { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-bottom: 14px; color: var(--ink-2); font-size: 13.5px; }
.status-line strong { color: var(--ink); font-variant-numeric: tabular-nums; }
.status-line select { padding: 3px 6px; border: 1px solid var(--line-strong); border-radius: 4px; background: var(--surface); }
.status-line .push { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(272px, 1fr)); gap: 12px; }
.card {
  display: flex; flex-direction: column; gap: 6px; min-width: 0; padding: 13px 14px 12px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  color: inherit; text-decoration: none;
}
.card:hover { border-color: var(--line-strong); }
.kind { display: flex; align-items: center; gap: 7px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
.kind .when { margin-left: auto; letter-spacing: 0; text-transform: none; font-variant-numeric: tabular-nums; }
.card h3 { margin: 0; font: 600 16.5px/1.3 var(--font-display); overflow-wrap: anywhere; text-wrap: balance; }
.card p code, .lede code { font-family: var(--font-mono); font-size: 0.88em; background: var(--sunken); padding: 0 3px; border-radius: 3px; }
.card p { margin: 0; color: var(--ink-2); font-size: 13.5px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.card .tags { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12px; color: var(--ink-3); }
.card .rel { margin-top: auto; padding-top: 7px; border-top: 1px dashed var(--line); font-size: 12.5px; color: var(--ink-2); overflow-wrap: anywhere; }
.card .rel b { font-weight: 600; color: var(--ink); }
.more { margin: 18px auto 0; display: block; padding: 8px 18px; border: 1px solid var(--line-strong); background: var(--surface); border-radius: var(--radius); cursor: pointer; }
.empty { padding: 44px 20px; text-align: center; color: var(--ink-2); border: 1px dashed var(--line-strong); border-radius: var(--radius); }

/* ---- graph ---- */
.graph-wrap { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.graph-wrap canvas { display: block; width: 100%; height: min(68vh, 720px); min-height: 380px; touch-action: none; cursor: grab; }
.graph-tools { position: absolute; top: 10px; right: 10px; display: flex; gap: 4px; }
.graph-tools button { width: 32px; height: 32px; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 4px; cursor: pointer; font-size: 16px; line-height: 1; }
.tip { position: absolute; pointer-events: none; max-width: 280px; padding: 8px 10px; background: var(--ink); color: var(--surface); border-radius: 4px; font-size: 12.5px; line-height: 1.4; }
.tip b { display: block; font-size: 13px; }
.tip i { font-style: normal; opacity: 0.7; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; padding: 10px 12px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend .sep { width: 1px; background: var(--line); align-self: stretch; }
.stroke { width: 22px; height: 0; border-top: 2px solid var(--ink-3); }
.stroke[data-p="inferred"] { border-top-style: dashed; }
.stroke[data-p="curated"] { border-top-color: var(--accent); border-top-width: 3px; }
.focus-note { margin-bottom: 10px; padding: 8px 12px; background: var(--accent-wash); border-radius: var(--radius); display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; font-size: 13.5px; }

/* ---- node page ---- */
.page { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 30px; align-items: start; }
.page-head { grid-column: 1 / -1; }
.page-head h1 { margin: 6px 0 4px; font: 600 clamp(24px, 3.4vw, 34px)/1.15 var(--font-display); letter-spacing: -0.015em; overflow-wrap: anywhere; text-wrap: balance; }
.page-head .lede { margin: 8px 0 0; max-width: 68ch; color: var(--ink-2); font-size: 16px; }
.crumbs { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 13.5px; margin-bottom: 14px; }
.pill { display: inline-block; padding: 0 8px; border: 1px solid var(--line-strong); border-radius: 99px; font-size: 11.5px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-2); }
.pill[data-s="promote"], .pill[data-s="keep"] { border-color: var(--accent); color: var(--accent); }
.pill[data-s="stale"] { border-color: var(--warn); color: var(--warn); }
.page-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 12px; }
.prose { min-width: 0; max-width: 78ch; }
.prose > :first-child { margin-top: 0; }
.prose h2 { font: 600 19px/1.3 var(--font-display); margin: 28px 0 8px; }
.prose h3 { font: 600 14px/1.3 var(--font-body); margin: 20px 0 6px; }
.prose p, .prose li { overflow-wrap: anywhere; }
.prose ul { padding-left: 20px; }
.prose code { font-family: var(--font-mono); font-size: 0.86em; background: var(--sunken); padding: 1px 4px; border-radius: 3px; }
.prose pre { background: var(--sunken); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; overflow-x: auto; font-size: 12.5px; line-height: 1.5; }
.prose pre code { background: none; padding: 0; font-size: inherit; }
.prose blockquote { margin: 0 0 12px; padding-left: 12px; border-left: 3px solid var(--line-strong); color: var(--ink-2); }
.table-scroll { overflow-x: auto; }
.prose table { border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
.prose th, .prose td { padding: 5px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.prose th { font-weight: 600; color: var(--ink-2); }
.aside { min-width: 0; display: flex; flex-direction: column; gap: 22px; }
.aside section { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
.props { margin: 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 12px; font-size: 13px; }
.props dt { color: var(--ink-3); }
.props dd { margin: 0; overflow-wrap: anywhere; font-family: var(--font-mono); font-size: 12px; line-height: 1.6; }
.rel-group + .rel-group { margin-top: 14px; }
.rel-group h3 { margin: 0 0 4px; font: 500 12.5px/1.4 var(--font-mono); color: var(--ink-2); display: flex; gap: 8px; }
.rel-group h3 span { color: var(--ink-3); }
.rel-list { list-style: none; margin: 0; padding: 0; }
.rel-list li { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 2px 7px; padding: 5px 0; border-top: 1px solid var(--line); }
.rel-list .glyph { margin-top: 6px; }
.rel-list a { font-weight: 500; overflow-wrap: anywhere; }
.rel-list .why { grid-column: 2; font-size: 12.5px; color: var(--ink-2); overflow-wrap: anywhere; }
.prov { font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); padding-bottom: 1px; border-bottom: 2px solid var(--ink-3); margin-left: 6px; white-space: nowrap; }
.prov[data-p="inferred"] { border-bottom-style: dashed; }
.prov[data-p="curated"] { border-bottom-color: var(--accent); color: var(--accent); }

@media (max-width: 940px) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 14px; padding-inline: 16px; }
  .bar-in, .notice { padding-inline: 16px; }
  .rail { position: static; max-height: none; overflow: visible; }
  .rail-toggle { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border: 1px solid var(--line-strong); background: var(--surface); border-radius: var(--radius); cursor: pointer; }
  .rail-body { margin-top: 14px; }
  .rail:not([data-open="1"]) .rail-body { display: none; }
  .page { grid-template-columns: minmax(0, 1fr); }
  .brand span { display: none; }
}
@media (prefers-reduced-motion: no-preference) {
  .card, .opt, .tag { transition: border-color 0.12s, background-color 0.12s; }
}
</style>

<header class="bar">
  <div class="bar-in">
    <a class="brand" href="#" id="home"><b>__TITLE__</b><span>__TAGLINE__</span></a>
    <label class="search"><span class="sr">Search nodes</span>
      <input id="q" type="search" placeholder="Search titles, ids, tags, text" autocomplete="off" spellcheck="false">
    </label>
    <div class="seg" role="group" aria-label="View">
      <button type="button" id="v-cards" aria-pressed="true">Cards</button>
      <button type="button" id="v-graph" aria-pressed="false">Graph</button>
    </div>
  </div>
</header>

<p class="notice" id="notice">__NOTICE__</p>
<div class="shell" id="browse">
  <nav class="rail" id="rail" aria-label="Filters">
    <button type="button" class="rail-toggle" id="rail-toggle" aria-expanded="false">Filters <span id="rail-count"></span></button>
    <div class="rail-body">
      <section><h2>Type</h2><div id="f-types"></div></section>
      <section id="sec-status" hidden><h2>Status</h2><div id="f-status"></div></section>
      <section><h2>Edge provenance</h2><div id="f-prov"></div></section>
      <section><h2>Tags</h2>
        <input type="search" id="tagq" placeholder="Filter tags" aria-label="Filter the tag list">
        <div class="tagbox" id="f-tags"></div>
        <p style="margin:8px 0 0"><button type="button" class="linkish" id="tags-more" hidden>Show all tags</button></p>
      </section>
      <section><button type="button" class="linkish" id="clear">Clear all filters</button></section>
    </div>
  </nav>
  <main id="results" aria-live="polite"></main>
</div>
<div class="shell" id="detail" hidden style="grid-template-columns:minmax(0,1fr)"><main id="node"></main></div>

<script type="application/json" id="cll-data">__DATA__</script>
<script>
(() => {
  "use strict";
  const DATA = JSON.parse(document.getElementById("cll-data").textContent);
  const CFG = DATA.config;
  const NODES = DATA.nodes;
  const byId = new Map(NODES.map((n) => [n.id, n]));
  const LABELS = { tool: "Tool", script: "Script", fn: "Function", session: "Session", day: "Day", repo: "Repo", log: "Log", logday: "Log digest" };
  const PLURAL = { tool: "Tools", script: "Scripts", fn: "Functions", session: "Sessions", day: "Days", repo: "Repos", log: "Logs", logday: "Log digests" };
  const TYPE_ORDER = ["tool", "script", "fn", "session", "day", "repo", "log", "logday"];
  const PROVS = ["extracted", "inferred", "curated"];
  const INVERSE = { defines: "defined_in", defined_in: "defines" };
  const EDGE_ORDER = ["defined_in", "part_of", "defines", "sources", "invokes", "calls", "uses", "runs", "touches", "on_day", "follows", "from_source", "pairs_with"];
  const edgeRank = (t) => { const i = EDGE_ORDER.indexOf(t); return i < 0 ? EDGE_ORDER.length : i; };

  // ---- derive --------------------------------------------------------------
  for (const n of NODES) {
    n.out = (n.edges || []).filter((e) => byId.has(e.target));
    n.dangling = (n.edges || []).filter((e) => !byId.has(e.target));
    n.inn = [];
    n.hay = [n.title, n.id, n.summary, (n.tags || []).join(" "), (n.html || "").replace(/<[^>]+>/g, " ")].join(" ").toLowerCase();
  }
  for (const n of NODES) for (const e of n.out) {
    const t = byId.get(e.target);
    const inv = INVERSE[e.type];
    if (inv && t.out.some((x) => x.type === inv && x.target === n.id)) continue;
    t.inn.push({ type: e.type, source: n.id, provenance: e.provenance, why: e.why, weight: e.weight });
  }
  for (const n of NODES) n.degree = n.out.length + n.inn.length;
  const types = [...new Set(NODES.map((n) => n.type))].sort((a, b) => {
    const ia = TYPE_ORDER.indexOf(a), ib = TYPE_ORDER.indexOf(b);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.localeCompare(b);
  });
  const statuses = [...new Set(NODES.map((n) => n.status || "draft"))].sort();

  // ---- state ---------------------------------------------------------------
  const S = { q: "", types: new Set(), tags: new Set(), status: new Set(), prov: new Set(PROVS),
              sort: "recent", view: "cards", shown: CFG.page_size, focus: null, hops: 1, allTags: false, tagq: "" };
  const store = {
    get(k) { try { return localStorage.getItem("cll." + k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem("cll." + k, v); } catch { /* optional */ } },
  };
  if (["recent", "title", "linked"].includes(store.get("sort"))) S.sort = store.get("sort");

  const $ = (id) => document.getElementById(id);
  const el = (tag, attrs = {}, ...kids) => {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v === false || v == null) continue;
      if (k === "class") e.className = v;
      else if (k === "text") e.textContent = v;
      else if (k === "html") e.innerHTML = v;
      else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? "" : v);
    }
    for (const kid of kids.flat()) if (kid != null && kid !== false) e.append(kid);
    return e;
  };
  const glyph = (t) => el("i", { class: "glyph", "data-t": t, "aria-hidden": "true" });
  // `code` spans inside one-line summaries, without interpreting anything else as markup
  const inline = (text) => String(text).split("`").map((part, i) => (i % 2 ? el("code", { text: part }) : part));
  const hashOf = (id) => "#" + id.replace(/\//g, "~");
  const idOf = (hash) => { try { return decodeURIComponent(hash.replace(/^#/, "")).replace(/~/g, "/"); } catch { return ""; } };
  const label = (t) => LABELS[t] || t;
  const day = (iso) => (iso ? String(iso).slice(0, 10) : "");

  // ---- filtering -----------------------------------------------------------
  function matches(n, skip) {
    if (skip !== "types" && S.types.size && !S.types.has(n.type)) return false;

    if (G.nodes.length) { wireCanvas(cv, tip); G.touched = false; G.fit = true; G.alpha = Math.max(G.alpha, 0.05); loop(); }
  }

  // ---- node page -----------------------------------------------------------
  const fmt = (v) => (Array.isArray(v) ? v.join(", ") : v && typeof v === "object" ? Object.entries(v).map(([k, x]) => `${k}: ${x}`).join(", ") : String(v));
  function relSection(title, groups, pick, limit) {
    if (!groups.size) return null;
    const order = [...groups].sort((a, b) => edgeRank(a[0]) - edgeRank(b[0]) || a[0].localeCompare(b[0]));
    return el("section", {}, el("h2", { text: title }), order.map(([type, edges]) => {
      edges.sort((a, b) => (b.weight || 1) - (a.weight || 1));
      const list = el("ul", { class: "rel-list" });
      const fill = (n) => list.replaceChildren(...edges.slice(0, n).map((e) => {
        const t = byId.get(pick(e));
        return el("li", {}, glyph(t.type), el("div", {}, el("a", { href: hashOf(t.id), text: t.title }), el("span", { class: "prov", "data-p": e.provenance, text: e.provenance })),
          e.why ? el("div", { class: "why", text: e.why }) : null);
      }), edges.length > n ? el("li", {}, el("span"), el("button", { type: "button", class: "linkish", onclick: () => fill(edges.length), text: `Show all ${edges.length}` })) : "");
      fill(limit);
      return el("div", { class: "rel-group" }, el("h3", {}, type, el("span", { text: String(edges.length) })), list);
    }));
  }
  function group(edges) {
    const m = new Map();
    for (const e of edges) if (S.prov.has(e.provenance)) (m.get(e.type) || m.set(e.type, []).get(e.type)).push(e);
    return m;
  }
  function renderNode(n) {
    document.title = `${n.title} · ${CFG.title}`;
    const props = Object.entries(n.props || {}).filter(([, v]) => v !== null && v !== "" && !(Array.isArray(v) && !v.length) && !(typeof v === "object" && !Array.isArray(v) && !Object.keys(v).length));
    const prose = el("article", { class: "prose", html: n.html || "" });
    for (const t of prose.querySelectorAll("table")) { const w = el("div", { class: "table-scroll" }); t.replaceWith(w); w.append(t); }
    $("node").replaceChildren(el("div", { class: "page" },
      el("header", { class: "page-head" },
        el("div", { class: "crumbs" },
          el("a", { href: "#", text: "← All nodes" }),
          el("button", { type: "button", class: "linkish", onclick: () => { S.focus = n.id; S.view = "graph"; location.hash = ""; route(); }, text: "Show neighbourhood in graph" })),
        el("div", { class: "kind", "data-t": n.type }, glyph(n.type), label(n.type), el("span", { class: "pill", "data-s": n.status || "draft", text: n.status || "draft" })),
        el("h1", { text: n.title }),
        el("div", { class: "mono", style: "color:var(--ink-3)", text: n.id }),
        n.summary ? el("p", { class: "lede" }, inline(n.summary)) : null,
        (n.tags || []).length ? el("div", { class: "page-tags" }, n.tags.map((t) =>
          el("button", { type: "button", class: "tag", onclick: () => { clearAll(true); S.tags.add(t); S.view = "cards"; location.hash = ""; route(); }, text: t }))) : null),
      prose,
      el("aside", { class: "aside" },
        relSection("Relations", group(n.out), (e) => e.target, 8),
        relSection("Referenced by", group(n.inn), (e) => e.source, 8),
        n.dangling.length ? el("section", {}, el("h2", { text: "Links to nodes not in this site" }), el("ul", { class: "rel-list" }, n.dangling.map((e) =>
          el("li", {}, el("span"), el("div", {}, el("span", { class: "mono", text: `${e.type} → ${e.target}` }), el("span", { class: "prov", "data-p": e.provenance, text: e.provenance })),
            e.why ? el("div", { class: "why", text: e.why }) : null)))) : null,
        props.length ? el("section", {}, el("h2", { text: "Properties" }), el("dl", { class: "props" }, props.flatMap(([k, v]) => [el("dt", { text: k.replace(/_/g, " ") }), el("dd", { text: fmt(v) })]))) : null)));
    window.scrollTo(0, 0);
  }

  // ---- shell ---------------------------------------------------------------
  function clearAll(silent) {
    S.types.clear(); S.tags.clear(); S.status.clear(); S.prov = new Set(PROVS); S.q = ""; S.tagq = ""; S.focus = null; S.shown = CFG.page_size;
    $("q").value = ""; $("tagq").value = "";
    if (silent !== true) render();
  }
  function render() {
    $("v-cards").setAttribute("aria-pressed", String(S.view === "cards"));
    $("v-graph").setAttribute("aria-pressed", String(S.view === "graph"));
    renderRail();
    const list = NODES.filter((n) => matches(n));
    if (S.view === "graph") renderGraph(list); else { cancelAnimationFrame(G.raf); renderCards(list); }
  }
  function route() {
    const id = idOf(location.hash);
    const n = byId.get(id);
    $("browse").hidden = !!n;
    $("detail").hidden = !n;
    if (n) { cancelAnimationFrame(G.raf); renderNode(n); }
    else { document.title = CFG.title; render(); }
  }

  $("q").addEventListener("input", (e) => { S.q = e.target.value.trim(); S.shown = CFG.page_size; if (location.hash.length > 1) location.hash = ""; else render(); });
  $("tagq").addEventListener("input", (e) => { S.tagq = e.target.value.trim(); renderRail(); });
  $("tags-more").addEventListener("click", () => { S.allTags = !S.allTags; renderRail(); });
  $("clear").addEventListener("click", () => clearAll());
  $("v-cards").addEventListener("click", () => { S.view = "cards"; S.focus = null; if (location.hash.length > 1) location.hash = ""; else render(); });
  $("v-graph").addEventListener("click", () => { S.view = "graph"; if (location.hash.length > 1) location.hash = ""; else render(); });
  $("rail-toggle").addEventListener("click", () => {
    const open = $("rail").dataset.open !== "1";
    $("rail").dataset.open = open ? "1" : "0";
    $("rail-toggle").setAttribute("aria-expanded", String(open));
  });
  addEventListener("hashchange", route);
  addEventListener("resize", () => { if ($("cv")) draw(); });
  const retheme = () => { G.css = null; if ($("cv")) draw(); };
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", retheme);
  new MutationObserver(retheme).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  route();
})();
</script>
