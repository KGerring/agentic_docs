[project]
name = "cll-brain"
version = "0.1.0"
description = "Closed-learning-loop second brain: collect shell history, git, logs and shell-script graphs into frontmatter-annotated, typed-linked markdown."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "markdown-it-py>=3.0",
]

[project.optional-dependencies]
# Exact shell-script parsing. Without it the heuristic parser is used.
ts = [
    "tree-sitter>=0.23",
    "tree-sitter-bash>=0.23",
]

[project.scripts]
cll = "cll.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cll"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9", "pre-commit>=4"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PIE", "RUF"]
ignore = [
    "E501",    # long lines are left to the formatter
    "SIM102",  # a nested `if` often reads better than one long condition
    "SIM108",  # ternaries are not always clearer
    "RUF001",  # the × and − in generated text are intentional
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["cll"]

# --- pixi (optional) --------------------------------------------------------
# uv is the primary workflow. These tables let `pixi install` / `pixi run collect`
# use the same manifest; uv and hatchling ignore them.
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.dependencies]
python = ">=3.12"

[tool.pixi.pypi-dependencies]
cll-brain = { path = ".", editable = true, extras = ["ts"] }

[tool.pixi.tasks]
collect = "cll run"
site = "cll site"
doctor = "cll doctor"

[tool.pixi.feature.dev.pypi-dependencies]
pytest = ">=8"
ruff = ">=0.9"

[tool.pixi.feature.dev.tasks]
test = "pytest -q"
lint = "ruff check . && ruff format --check ."

[tool.pixi.environments]
dev = ["dev"]
